train:
  start_time: 0
  num_times: 10
  iterations: 30000
  incremental_iterations: 30000
  temporal_stage1_until: 10000
  temporal_stage2_until: 25000
  temporal_min_observed_views: all
  # Static multi-view streams use no temporal latent/history MLP. Each task
  # receives a copied property-MLP head while prior heads remain frozen.
  static_view_stream: false
  log_interval: 100
  vis_interval: 1000
  vis_special_view_idx: -1
  vis_t0_image_path: null
  vis_generate_gif: true

  lr_position: 0.00016
  lr_position_final: 0.0000016
  lr_delay_mult: 0.01
  lr_feature: 0.0025
  lr_opacity: 0.05
  lr_scaling: 0.005
  lr_rotation: 0.001

  percent_dense: 0.01
  densification_interval: 100
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000

  split_from_iter: 100
  split_until_iter: 3000
  prune_from_iter: 100
  prune_until_iter: 3000

  phase1: 3000
  idea2_local_gaussian_cap_ratio: 1.0
  idea2_stage3_allow_local_split: false
  idea2_stage3_allow_local_prune: false
  idea2_stage3_allow_base_prune: false

  mask_recompute_interval: 500
  sphere_prune_interval: 15
  lambda_dssim: 0.2

model:
  name: irc-gs
  representation: gaussian
  sh_degree: 3
  optimizer_type: sparse_adam
  # The canonical cl-splats method is executed from this sibling checkout.
  # The outer model settings are kept for the legacy in-tree trainer and for
  # checkpoint compatibility; the bridge uses the official defaults below.
  official_cl_splats:
    root: null
    python: null
    iters_per_timestep: 100
    sh_degree: 0
    offline: false
    prefer_hardlinks: true
    change_threshold: null
    dilate_mask: null
    dilate_kernel_size: null
    upsample: null
    lambda_bound: null
    prune_every: null
    prune_dist_thresh: null
    prune_consecutive: null
    overrides: []
  fourdgs:
    # WAT uses a generated transforms_train.json input, with the upstream
    # multiple-view hyperparameters captured in this WAT-specific preset.
    configs: arguments/dnerf/wat_default.py
    iterations: 30000
    coarse_iterations: 3000
    opacity_reset_interval: 3000
    # Keep 1.0 for the normal protocol. Set to 0.5 for high-memory scenes.
    image_scale: 1.0
    # Upstream 4DGS multipleview preprocessing voxel-downsamples fused.ply to
    # below 40k points before its 200k/360k prune/densification schedule.
    initial_point_max_points: 40000
  rebuild_every_timestep: false
  temporal_mode: per_anchor

dataset:
  type: colmap
  path: null
  resolution: 1.0
  white_background: false
  eval: false
  split_seed: 0
  prefer_undist: true

change_detection:
  threshold: 0.2
  dilate_mask: true
  dilate_kernel_size: 13
  upsample: true

lifter:
  vote_threshold: 5

sampling:
  num_clusters: 10
  samples_per_round: 100
  max_rounds: 10
  min_points_for_region_sampling: 50
  majority_vote_threshold: 2
  num_new_points: 1000

pruning:
  min_cluster_size: 1000
  quantile: 0.98
  radius_multiplier: 1.1

output_dir: outputs
log_level: INFO
log_to_file: true
save_interval: 1

wandb_project: irc-gs
wandb_run_name: null
wandb_mode: disabled

history:
  log_history: true
  dir: null                     # null -> <output_dir>/history
  eval_recovered: true          # render t0..current after every timestep
  save_recovery_images: true    # save rendered and GT PNGs for each rollback
  keep_recovered_ply: true      # keep recovered scenes for manual rendering
  keep_eval_checkpoints: false  # lightweight temporary .pt files are disposable
  keep_full_checkpoints: true   # train.sh also summarizes checkpoint_t*.pt/.ply

resume_from: null
white_background: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
